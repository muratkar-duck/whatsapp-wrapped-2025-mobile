function drawWordCloud(canvas, agg, mode='screen'){
      const wordsRaw = agg?.wordCloud||[];
      if(!wordsRaw.length) return;
      const rect = canvas.getBoundingClientRect();
      const parentRect = canvas.parentElement?.getBoundingClientRect();
      const cssWidth = Math.max(rect.width||0, parentRect?.width||0, 640);
      const cssHeight = Math.max(rect.height||0, parentRect?.height||0, 260);
      const scale = Math.max(2, window.devicePixelRatio||1);
      canvas.width = Math.round(cssWidth * scale);
      canvas.height = Math.round(cssHeight * scale);
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(scale,0,0,scale,0,0);
      ctx.clearRect(0,0,cssWidth,cssHeight);
      ctx.fillStyle = '#f8f5fd';
      ctx.fillRect(0,0,cssWidth,cssHeight);

      const maxWords = mode==='print'? wordCloudConfig.maxWordsPrint : wordCloudConfig.maxWordsScreen;
      const maxFreq = wordsRaw[0]?.count || 1;
      const freqThreshold = Math.min(maxFreq, Math.max(wordCloudConfig.minFrequency, Math.floor(maxFreq*0.015)));
      const words = wordsRaw.filter(w=>w.count>=freqThreshold).slice(0, maxWords);
      if(!words.length) return;
      const minFreq = words[words.length-1].count || 1;
      const seed = deriveWordCloudSeed(agg, words);
      const rng = mulberry32(seed);
      const occW = Math.ceil(cssWidth);
      const occH = Math.ceil(cssHeight);
      const occupancy = new Uint8Array(occW*occH);
      const centerX = cssWidth/2; const centerY = cssHeight/2;
      const placements = [];
      const angleStep = 0.35;
      const baseStep = 6;

      for(const w of words){
        const fontSize = mapFreqToFont(w.count, minFreq, maxFreq);
        const wordHash = hashString(w.word);
        const allowRotate = wordCloudConfig.allowRotate;
        const rotated = allowRotate && (Math.abs(wordHash)%10 < Math.round(wordCloudConfig.rotationRatio*10));
        const glyph = buildGlyph(w.word, fontSize, rotated);
        const maxAttempts = 1400;
        let placed=false;
        for(let i=0;i<maxAttempts;i++){
          const theta = i*angleStep + rng()*0.2;
          const radius = baseStep + (4 + fontSize*0.16) * theta;
          const x = centerX + Math.cos(theta)*radius;
          const y = centerY + Math.sin(theta)*radius;
          if(!fitsGlyph(occupancy, occW, occH, x, y, glyph)) continue;
          placements.push({text:w.word, fontSize, rotate:rotated, x, y, color: WORD_CLOUD_PALETTE[Math.abs(wordHash)%WORD_CLOUD_PALETTE.length]});
          stampGlyph(occupancy, occW, occH, x, y, glyph);
          placed=true; break;
        }
        if(!placed) console.debug('Kelime yerleştirilemedi', w.word);
      }

      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.shadowColor='rgba(41,25,65,0.15)';
      ctx.shadowBlur=2;
      ctx.shadowOffsetY=1;
      placements.forEach(p=>{
        ctx.save();
        ctx.translate(p.x,p.y);
        if(p.rotate) ctx.rotate(Math.PI/2);
        ctx.fillStyle=p.color;
        ctx.font = `${p.fontSize}px ${getWordCloudFont()}`;
        ctx.lineWidth = 1;
        ctx.strokeStyle='rgba(255,255,255,0.35)';
        ctx.strokeText(p.text,0,0);
        ctx.fillText(p.text,0,0);
        ctx.restore();
      });
    }

    function mapFreqToFont(freq, minFreq, maxFreq){
      const logMin = Math.log(Math.max(minFreq,1));
      const logMax = Math.log(Math.max(maxFreq,1));
      const norm = (Math.log(Math.max(freq,1)) - logMin) / Math.max(logMax - logMin, 0.0001);
      const eased = Math.pow(Math.min(Math.max(norm,0),1), 0.65);
      return Math.max(wordCloudConfig.minFont, Math.min(wordCloudConfig.maxFont, wordCloudConfig.minFont + eased*(wordCloudConfig.maxFont - wordCloudConfig.minFont)));
    }

    function buildGlyph(text, fontSize, rotate){
      const pad = Math.ceil(fontSize*0.3);
      const tmp = document.createElement('canvas');
      const ctx = tmp.getContext('2d');
      ctx.font = `${fontSize}px ${getWordCloudFont()}`;
      const metrics = ctx.measureText(text);
      const textWidth = metrics.width;
      const textHeight = fontSize;
      const boxWidth = rotate? textHeight : textWidth;
      const boxHeight = rotate? textWidth : textHeight;
      tmp.width = Math.ceil(boxWidth + pad*2);
      tmp.height = Math.ceil(boxHeight + pad*2);
      ctx.translate(tmp.width/2, tmp.height/2);
      if(rotate) ctx.rotate(Math.PI/2);
      ctx.font = `${fontSize}px ${getWordCloudFont()}`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#fff';
      ctx.fillText(text,0,0);
      const data = ctx.getImageData(0,0,tmp.width,tmp.height);
      return {data,width:tmp.width,height:tmp.height};
    }

    function fitsGlyph(occ, w, h, cx, cy, glyph){
      const startX = Math.round(cx - glyph.width/2);
      const startY = Math.round(cy - glyph.height/2);
      if(startX<0 || startY<0 || startX + glyph.width >= w || startY + glyph.height >= h) return false;
      const pixels = glyph.data.data;
      for(let y=0;y<glyph.height;y++){
        const row = (startY + y)*w + startX;
        for(let x=0;x<glyph.width;x++){
          const alpha = pixels[(y*glyph.width + x)*4 + 3];
          if(alpha>0 && occ[row + x]) return false;
        }
      }
      return true;
    }

    function stampGlyph(occ, w, h, cx, cy, glyph){
      const startX = Math.round(cx - glyph.width/2);
      const startY = Math.round(cy - glyph.height/2);
      const pixels = glyph.data.data;
      for(let y=0;y<glyph.height;y++){
        const row = (startY + y)*w + startX;
        for(let x=0;x<glyph.width;x++){
          const alpha = pixels[(y*glyph.width + x)*4 + 3];
          if(alpha>0) occ[row + x] = 1;
        }
      }
    }

    function deriveWordCloudSeed(agg, words){
      const topWord = words[0]?.word||'';
      const rangePart = `${agg.range?.min||''}|${agg.range?.max||''}`;
      const vocabHash = hashString(words.slice(0,40).map(w=>`${w.word}:${w.count}`).join('|'));
      return hashString(`${rangePart}|${topWord}|${words.length}|${vocabHash}`);
    }

    function getWordCloudFont(){
      return "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial";
    }

    function hashString(str){
      let h = 1779033703 ^ str.length;
      for(let i=0;i<str.length;i++){
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return (h ^ (h >>> 16)) >>> 0;
    }

    function mulberry32(a){
      return function(){
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function rerenderWordCloudScreen(){
      const cv = document.getElementById('wordCloudCanvas');
      if(cv instanceof HTMLCanvasElement && latestAgg){
        drawWordCloud(cv, latestAgg, 'screen');
      }
    }

    function chartCard(title, data, drawer){
      const card = html(`<div class="card"><h3>${title}</h3><canvas></canvas></div>`);
      const cv = card.querySelector('canvas');
      drawer(cv,data);
      return card;
    }

    function getCanvasDims(canvas){
      const ratio = canvas.__ratio || Math.max(2, window.devicePixelRatio||1);
      return {
        w: canvas.__cssWidth || (canvas.width/ratio),
        h: canvas.__cssHeight || (canvas.height/ratio)
      };
    }

    
    function niceTicks(maxVal, target=5){
      const rawStep = Math.max(maxVal,1) / target;
      const pow = Math.pow(10, Math.floor(Math.log10(rawStep)));
      const multiples = [1,2,5,10];
      let step = multiples[multiples.length-1]*pow;
      for(const m of multiples){
        if(rawStep <= m*pow){ step = m*pow; break; }
      }
      const yMaxNice = Math.ceil(Math.max(maxVal,1) / step) * step;
      const ticks = Math.max(2, Math.round(yMaxNice/step));
      return {step, yMaxNice, ticks};
    }

    function drawAxes(ctx, w, h, yMax, yLabel, xLabel, xTickLabels, xTickPositions){
      const padL=52, padB=36, padT=12, padR=12;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;

      const accent = (getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6b1e2d');

      // grid + y ticks (nice rounded steps)
      const {step, yMaxNice, ticks} = niceTicks(yMax, 5);
      ctx.save();
      ctx.strokeStyle = '#e9e2ec';
      ctx.fillStyle = '#2b213f';
      ctx.font = '12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto';

      for(let i=0;i<=ticks;i++){
        const val = i*step;
        const y = padT + plotH - (val/yMaxNice)*plotH;
        // grid
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL+plotW, y); ctx.stroke();
        // labels
        ctx.textAlign='right'; ctx.textBaseline='middle';
        ctx.fillText(String(Math.round(val)), padL-8, y);
      }

      // axes
      ctx.strokeStyle = '#2b213f';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, padT); ctx.lineTo(padL, padT+plotH); ctx.lineTo(padL+plotW, padT+plotH);
      ctx.stroke();

      // axis labels
      ctx.fillStyle = accent;
      ctx.font = '700 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText(yLabel, 10, 6);
      ctx.textAlign='right'; ctx.textBaseline='bottom';
      ctx.fillText(xLabel, w-10, h-6);

      // x tick labels
      ctx.fillStyle = '#2b213f';
      ctx.font = '11px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto';
      ctx.textAlign='center'; ctx.textBaseline='top';
      for(let i=0;i<xTickPositions.length;i++){
        const x = padL + xTickPositions[i]*plotW;
        const label = xTickLabels[i]||'';
        ctx.fillText(label, x, padT+plotH+8);
      }

      ctx.restore();
      return {padL,padB,padT,padR,plotW,plotH,yMaxNice};
    }


    function setupCanvas(canvas, desiredH=260){
      const ratio = window.devicePixelRatio || 2;
      const w = canvas.clientWidth||canvas.parentElement.clientWidth||600;
      const h = desiredH;
      canvas.style.height = desiredH+'px';
      canvas.width = Math.round(w*ratio);
      canvas.height = Math.round(h*ratio);
      const ctx=canvas.getContext('2d');
      ctx.setTransform(ratio,0,0,ratio,0,0);
      ctx.clearRect(0,0,w,h);
      return {ctx,w,h};
    }

    function drawLineChart(canvas, map){
      const {ctx,w,h} = setupCanvas(canvas, 260);
      const entries = Array.from(map.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
      const vals = entries.map(e=>e[1]); const max=Math.max(...vals,1);

      const accent = (getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6b1e2d');
      const gold = (getComputedStyle(document.documentElement).getPropertyValue('--gold').trim() || '#c7b299');

      // x ticks: 6 labels max
      const tickCount = Math.min(6, entries.length);
      const xTickLabels=[]; const xTickPos=[];
      for(let i=0;i<tickCount;i++){
        const idx = Math.round(i*(entries.length-1)/(tickCount-1||1));
        xTickLabels.push(formatDateShortTR(new Date(entries[idx][0]+'T00:00:00')));
        xTickPos.push(idx/(entries.length-1||1));
      }

      const axes = drawAxes(ctx,w,h,max,'Mesaj','Tarih', xTickLabels, xTickPos);
      const {padL,padT,plotW,plotH,yMaxNice} = axes;

      // line
      ctx.save();
      ctx.strokeStyle=accent;
      ctx.lineWidth=2.25;
      ctx.beginPath();
      entries.forEach((e,i)=>{
        const x = padL + (i/(entries.length-1||1))*plotW;
        const y = padT + plotH - (e[1]/yMaxNice)*plotH;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();

      // points
      ctx.fillStyle=gold;
      entries.forEach((e,i)=>{
        const x = padL + (i/(entries.length-1||1))*plotW;
        const y = padT + plotH - (e[1]/yMaxNice)*plotH;
        ctx.beginPath(); ctx.arc(x,y,2.6,0,Math.PI*2); ctx.fill();
      });
      ctx.restore();
    }


    function drawBarChartMonth(canvas, map){
      const {ctx,w,h} = setupCanvas(canvas, 260);
      const months = Array.from(map.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
      const max=Math.max(...months.map(m=>m[1]),1);
      const labels = months.map(m=>m[0].slice(5)); // MM
      const tickIdx = [0,3,6,9,11].filter(i=>i<labels.length);
      const xTickLabels = tickIdx.map(i=>labels[i]);
      const xTickPos = tickIdx.map(i=> i/Math.max(labels.length-1,1));
      const ax = drawAxes(ctx, w, h, max, 'Mesaj', 'Ay', xTickLabels, xTickPos);

      const barW = ax.plotW/Math.max(months.length,1);
      months.forEach((m,i)=>{
        const v=m[1];
        const bh=(v/max)*ax.plotH;
        const x=ax.padL + i*barW + 6;
        const y=ax.padT + ax.plotH - bh;
        ctx.fillStyle='#5d3fd3';
        ctx.fillRect(x, y, Math.max(barW-12,2), bh);
      });
    }

    function drawBarChartHours(canvas, arr){
      const {ctx,w,h} = setupCanvas(canvas, 260);
      const max=Math.max(...arr,1);
      const tickIdx=[0,6,12,18,23];
      const xTickLabels=tickIdx.map(i=>String(i));
      const xTickPos=tickIdx.map(i=>i/23);
      const ax = drawAxes(ctx, w, h, max, 'Mesaj', 'Saat', xTickLabels, xTickPos);

      const barW = ax.plotW/24;
      arr.forEach((v,i)=>{
        const bh=(v/max)*ax.plotH;
        const x=ax.padL + i*barW + 1;
        const y=ax.padT + ax.plotH - bh;
        ctx.fillStyle='#f59e0b';
        ctx.fillRect(x, y, Math.max(barW-2,1), bh);
      });
    }

    function drawBarChartWeekdays(canvas, arr){
      const {ctx,w,h} = setupCanvas(canvas, 260);
      const max=Math.max(...arr,1);
      const labels=['Pzt','Sal','Çar','Per','Cum','Cts','Paz'];
      const xTickLabels = labels;
      const xTickPos = labels.map((_,i)=> i/6);
      const ax = drawAxes(ctx, w, h, max, 'Mesaj', 'Gün', xTickLabels, xTickPos);

      const barW = ax.plotW/7;
      arr.forEach((v,i)=>{
        const bh=(v/max)*ax.plotH;
        const x=ax.padL + i*barW + 8;
        const y=ax.padT + ax.plotH - bh;
        ctx.fillStyle='#0ea5e9';
        ctx.fillRect(x, y, Math.max(barW-16,2), bh);
      });
    }

    function drawHistogram(canvas, buckets){
      const {ctx,w,h} = setupCanvas(canvas, 260);
      const labels=['0-30sn','30-60sn','1-5dk','5-15dk','15-60dk','1-3s','3-10s','10-12s'];
      const max=Math.max(...buckets,1);
      const tickIdx=[0,2,4,6,7];
      const xTickLabels=tickIdx.map(i=>labels[i]);
      const xTickPos=tickIdx.map(i=> i/Math.max(labels.length-1,1));
      const ax = drawAxes(ctx, w, h, max, 'Adet', 'Süre aralığı', xTickLabels, xTickPos);

      const barW = ax.plotW/buckets.length;
      buckets.forEach((v,i)=>{
        const bh=(v/max)*ax.plotH;
        const x=ax.padL + i*barW + 6;
        const y=ax.padT + ax.plotH - bh;
        ctx.fillStyle='#22c55e';
        ctx.fillRect(x, y, Math.max(barW-12,2), bh);
      });
    }

    function drawMapChart(canvas, map){
      const {ctx,w,h} = setupCanvas(canvas, 260);
      const entries = Array.from(map.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
      const max=Math.max(...entries.map(e=>e[1]),1);

      const tickCount=Math.min(6, entries.length);
      const xTickLabels=[]; const xTickPos=[];
      for(let i=0;i<tickCount;i++){
        const idx = Math.floor(i*(entries.length-1)/Math.max(tickCount-1,1));
        xTickLabels.push(entries[idx][0].slice(-2)); // week number
        xTickPos.push(idx/Math.max(entries.length-1,1));
      }
      const ax = drawAxes(ctx, w, h, max, 'Adet', 'Hafta', xTickLabels, xTickPos);

      const barW = ax.plotW/Math.max(entries.length,1);
      entries.forEach((e,i)=>{
        const bh=(e[1]/max)*ax.plotH;
        const x=ax.padL + i*barW + 4;
        const y=ax.padT + ax.plotH - bh;
        ctx.fillStyle='#a855f7';
        ctx.fillRect(x, y, Math.max(barW-8,1), bh);
      });
    }

    function drawOverlay(canvas, data){
      const {ctx,w,h} = setupCanvas(canvas, 260);
      const maxHeight=h;
      const keys=data.map(d=>d.key);
      const plotMax=100;
      const tickCount=Math.min(6, data.length);
      const xTickLabels=[]; const xTickPos=[];
      for(let i=0;i<tickCount;i++){
        const idx = Math.floor(i*(data.length-1)/Math.max(tickCount-1,1));
        xTickLabels.push(keys[idx].slice(-2));
        xTickPos.push(idx/Math.max(data.length-1,1));
      }
      const ax = drawAxes(ctx, w, h, plotMax, 'Yoğunluk (0-100)', 'Hafta', xTickLabels, xTickPos);

      const colors={msgNorm:'#6366f1',laughNorm:'#f97316',romNorm:'#ec4899',dateiNorm:'#22c55e'};
      Object.entries(colors).forEach(([field,color])=>{
        ctx.beginPath();
        ctx.strokeStyle=color;
        ctx.lineWidth=2;
        data.forEach((d,i)=>{
          const x=ax.padL + (i/Math.max(data.length-1,1))*ax.plotW;
          const y=ax.padT + ax.plotH - (d[field]/100)*ax.plotH;
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
      });

      // legend
      ctx.fillStyle='#2d1b46';
      ctx.font='12px sans-serif';
      const items=[['Mesaj',colors.msgNorm],['Kahkaha',colors.laughNorm],['Romantizm',colors.romNorm],['Date’i',colors.dateiNorm]];
      items.forEach((it,i)=>{
        ctx.fillStyle=it[1];
        ctx.fillRect(ax.padL + i*90, 14, 12, 12);
        ctx.fillStyle='#2d1b46';
        ctx.fillText(it[0], ax.padL + i*90 + 16, 24);
      });
    }

    function html(str){
      const t=document.createElement('template'); t.innerHTML=str.trim(); return t.content.firstElementChild;
    }

    function escapeHtml(str){
      const map = {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"};
      return (str||'').replace(/[&<>"']/g,c=>map[c]||c);
    }

    function renderDebug(parsed, agg){
      debugEl.classList.remove('hidden');
      const msgCount = parsed.messages?.length ?? parsed.messagesCount ?? 0;
      const lines=[`Toplam satır: ${parsed.lines}`,`Toplam mesaj: ${msgCount}`,`Hata: ${parsed.parseErrors}`,`Aralık: ${parsed.range.min?dayKey(parsed.range.min):'-'} → ${parsed.range.max?dayKey(parsed.range.max):'-'}`];
      lines.push('Tür sayıları: '+JSON.stringify(agg.kindsCount));
      if(agg.emojiDebug?.length) lines.push('Emoji örnekleri: '+agg.emojiDebug.slice(0,20).join(' '));
      debugEl.innerHTML = '<strong>Debug</strong><br>'+lines.join('<br>');
      debugEl.appendChild(buildWordCloudControls());
    }

    function buildWordCloudControls(){
      const wrap = document.createElement('div');
      wrap.className = 'word-cloud-settings';
      wrap.innerHTML = `
        <div style="font-weight:800;margin-bottom:6px;">Word Cloud Settings</div>
        <label>Max kelime (ekran)</label>
        <select id="wcMaxWords">
          <option value="80">80</option>
          <option value="120">120</option>
          <option value="140">140</option>
          <option value="160">160</option>
        </select>
        <label>Min font (px) <span id="wcMinFontVal">${wordCloudConfig.minFont}</span></label>
        <input type="range" id="wcMinFont" min="12" max="26" value="${wordCloudConfig.minFont}">
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="wcRotate" ${wordCloudConfig.allowRotate?'checked':''}> Dikey kelimeler</label>
      `;
      const maxSel = wrap.querySelector('#wcMaxWords');
      if(maxSel) maxSel.value = String(wordCloudConfig.maxWordsScreen);
      maxSel?.addEventListener('change', ()=>{ wordCloudConfig.maxWordsScreen = Number(maxSel.value); rerenderWordCloudScreen(); });
      const minFont = wrap.querySelector('#wcMinFont');
      const minFontVal = wrap.querySelector('#wcMinFontVal');
      minFont?.addEventListener('input', ()=>{ wordCloudConfig.minFont = Number(minFont.value); if(minFontVal) minFontVal.textContent = wordCloudConfig.minFont; rerenderWordCloudScreen(); });
      const rotate = wrap.querySelector('#wcRotate');
      rotate?.addEventListener('change', ()=>{ wordCloudConfig.allowRotate = rotate.checked; rerenderWordCloudScreen(); });
      return wrap;
    }
  </script>


<script>
function formatTimeHHMM(d) {
  try{
    if(!d) return "—";
    const dt = (d instanceof Date) ? d : new Date(d);
    if (isNaN(dt.getTime())) return "—";
    const hh = String(dt.getHours()).padStart(2,'0');
    const mm = String(dt.getMinutes()).padStart(2,'0');
    return `${hh}:${mm}`;
  }catch(e){ return "—"; }
}
</script>


<script>
/* =========================
   PNG (300 DPI) Export + ZIP
   Self-contained (no libs).
   - Renders each .page to PNG via SVG foreignObject snapshot
   - Replaces <canvas> with <img> dataURLs in the clone (keeps charts sharp)
   - Packs PNGs into a ZIP (store method) with CRC32
   ========================= */

(function(){
  const btn = document.getElementById('exportPngZipBtn');
  const statusEl = document.getElementById('exportStatus');

  function setStatus(txt){
    if(!statusEl) return;
    statusEl.style.display = txt ? 'inline-flex' : 'none';
    statusEl.textContent = txt || '';
  }

  function downloadBlob(blob, filename){
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }

  // --- CRC32 ---
  const CRC_TABLE = (function(){
    const table = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[i] = c >>> 0;
    }
    return table;
  })();

  function crc32(buf){
    let c = 0xFFFFFFFF;
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // --- ZIP (store / no compression) ---
  class ZipStoreWriter {
    constructor(){
      this.files = [];
      this.offset = 0;
      this.chunks = [];
    }
    _u16(n){ const b = new Uint8Array(2); b[0]=n&255; b[1]=(n>>>8)&255; return b; }
    _u32(n){ const b = new Uint8Array(4); b[0]=n&255; b[1]=(n>>>8)&255; b[2]=(n>>>16)&255; b[3]=(n>>>24)&255; return b; }
    _str(s){ return new TextEncoder().encode(s); }

    addFile(name, dataU8, modDate = new Date()){
      const nameU8 = this._str(name);
      const data = dataU8 instanceof Uint8Array ? dataU8 : new Uint8Array(dataU8);
      const crc = crc32(data);
      const size = data.length;

      // MS-DOS date/time
      const dosTime = ((modDate.getHours() & 31) << 11) | ((modDate.getMinutes() & 63) << 5) | ((Math.floor(modDate.getSeconds()/2) & 31));
      const dosDate = (((modDate.getFullYear()-1980) & 127) << 9) | (((modDate.getMonth()+1) & 15) << 5) | ((modDate.getDate() & 31));

      const localHeader = [
        this._u32(0x04034b50), // local file header signature
        this._u16(20),         // version needed
        this._u16(0),          // flags
        this._u16(0),          // compression 0=store
        this._u16(dosTime),
        this._u16(dosDate),
        this._u32(crc),
        this._u32(size),
        this._u32(size),
        this._u16(nameU8.length),
        this._u16(0),          // extra len
        nameU8,
        data
      ];

      const localSize = localHeader.reduce((s, x)=>s + x.length, 0);
      this.chunks.push(...localHeader);

      this.files.push({
        nameU8, crc, size,
        dosTime, dosDate,
        offset: this.offset
      });
      this.offset += localSize;
    }

    finalize(){
      const centralStart = this.offset;
      const centralChunks = [];
      for(const f of this.files){
        centralChunks.push(
          this._u32(0x02014b50), // central dir signature
          this._u16(20),         // version made by
          this._u16(20),         // version needed
          this._u16(0),          // flags
          this._u16(0),          // compression
          this._u16(f.dosTime),
          this._u16(f.dosDate),
          this._u32(f.crc),
          this._u32(f.size),
          this._u32(f.size),
          this._u16(f.nameU8.length),
          this._u16(0),          // extra
          this._u16(0),          // comment
          this._u16(0),          // disk start
          this._u16(0),          // int attrs
          this._u32(0),          // ext attrs
          this._u32(f.offset),
          f.nameU8
        );
      }
      const centralSize = centralChunks.reduce((s,x)=>s+x.length,0);

      const end = [
        this._u32(0x06054b50),   // end of central dir signature
        this._u16(0),            // disk
        this._u16(0),            // central dir disk
        this._u16(this.files.length),
        this._u16(this.files.length),
        this._u32(centralSize),
        this._u32(centralStart),
        this._u16(0)             // comment length
      ];

      const all = [...this.chunks, ...centralChunks, ...end];
      return new Blob(all, {type: 'application/zip'});
    }
  }

  // --- DOM snapshot via SVG foreignObject ---
  function copyComputedStyles(srcEl, dstEl){
    const cs = getComputedStyle(srcEl);
    // Copy every computed property (slow but reliable for print/export)
    for (let i = 0; i < cs.length; i++){
      const prop = cs[i];
      dstEl.style.setProperty(prop, cs.getPropertyValue(prop), cs.getPropertyPriority(prop));
    }
  }

  function inlineStylesDeep(srcRoot, dstRoot){
    const srcAll = srcRoot.querySelectorAll('*');
    const dstAll = dstRoot.querySelectorAll('*');
    copyComputedStyles(srcRoot, dstRoot);
    for (let i=0; i<srcAll.length; i++){
      copyComputedStyles(srcAll[i], dstAll[i]);
    }
  }

  function replaceCanvasesWithImages(srcRoot, dstRoot) {
  try {
    const srcCanvases = srcRoot.querySelectorAll('canvas');
    const dstCanvases = dstRoot.querySelectorAll('canvas');
    const n = Math.min(srcCanvases.length, dstCanvases.length);
    for (let i = 0; i < n; i++) {
      const src = srcCanvases[i];
      const dst = dstCanvases[i];
      try {
        // Copy bitmap into cloned canvas
        dst.width = src.width;
        dst.height = src.height;
        const ctx = dst.getContext('2d');
        if (ctx) ctx.drawImage(src, 0, 0);
      } catch (e) {
        // ignore
      }
      try {
        // Additionally replace canvas with img to avoid foreignObject issues
        const dataUrl = src.toDataURL('image/png');
        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = '';
        img.style.width = getComputedStyle(dst).width;
        img.style.height = getComputedStyle(dst).height;
        img.style.display = 'block';
        img.style.objectFit = 'contain';
        dst.replaceWith(img);
      } catch (e) {
        // ignore if tainted
      }
    }
  } catch (e) {
    // ignore
  }
}

async function nodeToPngBlob(node, targetWidth, targetHeight){
    // Firefox-safe renderer:
    // Prefer html2canvas (captures <canvas> charts correctly and avoids SVG foreignObject blank exports).
    if (window.html2canvas) {
      // Ensure the node is visible during render
      const prevVis = node.style.visibility;
      node.style.visibility = 'visible';

      const rect = node.getBoundingClientRect();

      // IMPORTANT: don't rely on rect.left/top (stage may be offscreen).
      // Capture the full node at 1:1 and then scale to target size.
      const w = Math.round(node.scrollWidth || rect.width);
      const h = Math.round(node.scrollHeight || rect.height);

      const canvas = await window.html2canvas(node, {
        backgroundColor: null,
        scale: 1,
        useCORS: true,
        allowTaint: true,
        logging: false,
        removeContainer: true,
        width: w,
        height: h,
        windowWidth: w,
        windowHeight: h,
        x: 0,
        y: 0,
        scrollX: 0,
        scrollY: 0
      });

      node.style.visibility = prevVis;

      // Normalize to exact target dimensions (guarantee 4960x7016)
      let outCanvas = canvas;
      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        outCanvas = document.createElement('canvas');
        outCanvas.width = targetWidth;
        outCanvas.height = targetHeight;
        const octx = outCanvas.getContext('2d');
        octx.clearRect(0, 0, targetWidth, targetHeight);
        octx.drawImage(canvas, 0, 0, targetWidth, targetHeight);
      }

      const pngBlob = await new Promise(res => outCanvas.toBlob(res, 'image/png'));
      return pngBlob;
    }

    // Fallback (Chromium works; Firefox may output blank)
    const prevVis = node.style.visibility;
    node.style.visibility = 'visible';

    const rect = node.getBoundingClientRect();
    const w = Math.round(rect.width);
    const h = Math.round(rect.height);
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    svg.setAttribute('width', String(w));
    svg.setAttribute('height', String(h));
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

    const fo = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
    fo.setAttribute('x', '0');
    fo.setAttribute('y', '0');
    fo.setAttribute('width', '100%');
    fo.setAttribute('height', '100%');

    const clone = node.cloneNode(true);
    clone.style.margin = '0';
    clone.style.transform = 'none';
    clone.style.width = w + 'px';
    clone.style.height = h + 'px';
    clone.style.overflow = 'hidden';
    fo.appendChild(clone);
    svg.appendChild(fo);

    const svgStr = new XMLSerializer().serializeToString(svg);
    const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    img.decoding = 'async';
    img.loading = 'eager';
    img.src = url;
    await img.decode().catch(()=>{});

    const canvas = document.createElement('canvas');
    canvas.width = targetWidth;
    canvas.height = targetHeight;
    const ctx = canvas.getContext('2d');

    const sca = targetWidth / w;
    ctx.setTransform(sca, 0, 0, sca, 0, 0);
    ctx.drawImage(img, 0, 0);

    URL.revokeObjectURL(url);
    node.style.visibility = prevVis;

    const pngBlob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
    return pngBlob;
  }

  function pad2(n){ return String(n).padStart(2,'0'); }

  
/* =========================
   EXPORT: PAGINATION + FULL-CANVAS CAPTURE (v28)
   ========================= */

/**
 * Split any section that grows beyond one A4 into multiple "continuation" pages.
 * Works best for long lists (wait blocks, <ul class="list">, etc.).
 *
 * Strategy:
 * - Clone the original section
 * - Temporarily allow it to grow (height:auto; overflow:visible) to measure overflow
 * - If it exceeds the base A4 height, move "breakable items" from the bottom into continuation pages
 */
function buildPaginatedExportSections(originalSection) {
  const baseTitle =
    (originalSection.querySelector("h1,h2,h3")?.textContent || "Devam")
      .replace(/\s+/g, " ")
      .trim();

  // 1) First clone: we'll try to make it fit by moving items out
  const first = originalSection.cloneNode(true);

  // For measurement we need it in DOM; we'll mount it into exportStage later.
  // We'll return a "builder" function that paginates once mounted.
  first.__paginationMeta = { baseTitle };
  return [first];
}

/**
 * Find breakable items inside a page clone (things we can move to the next page).
 * Priority: explicit data-break-item, then common list items.
 */
function getBreakableItems(pageRoot) {
  const explicit = Array.from(pageRoot.querySelectorAll("[data-break-item]"));
  if (explicit.length) return explicit;

  // Heuristics: wait blocks + list items (ordered by DOM)
  return Array.from(
    pageRoot.querySelectorAll(".wait-block, ul.list > li, .list > li")
  );
}

/**
 * Creates a continuation page that keeps the same background style,
 * but shows only a title and a flowing stack of moved items.
 */
function makeContinuationPage(fromPage, titleText) {
  const cont = fromPage.cloneNode(true);

  // Remove everything inside the page and rebuild a minimal layout
  cont.querySelectorAll("script").forEach((s) => s.remove());

  // Keep background layers (they're on the root via pseudo/CSS). We'll just wipe children.
  while (cont.firstChild) cont.removeChild(cont.firstChild);

  const header = document.createElement("div");
  header.style.padding = "18mm 18mm 8mm 18mm";
  header.innerHTML = `
    <div style="display:flex; align-items:flex-end; gap:10px;">
      <div style="font-family: inherit; font-weight:800; font-size: 22pt; letter-spacing: -0.02em; color:#fff;">
        ${escapeHtml(titleText)}
      </div>
      <div style="opacity:.7; color:#fff; font-size:11pt; margin-bottom:3px;">(devam)</div>
    </div>
    <div style="height:3px; width:80mm; margin-top:6mm; background: linear-gradient(90deg,#7c3aed,#ec4899); border-radius:99px; opacity:.9;"></div>
  `;

  const body = document.createElement("div");
  body.style.padding = "0 18mm 18mm 18mm";

  const card = document.createElement("div");
  card.className = "card";
  card.style.padding = "10mm";
  card.style.minHeight = "0";

  const flow = document.createElement("div");
  flow.className = "continuation-flow";
  flow.style.display = "flex";
  flow.style.flexDirection = "column";
  flow.style.gap = "6mm";

  card.appendChild(flow);
  body.appendChild(card);

  cont.appendChild(header);
  cont.appendChild(body);

  return { cont, flow };
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/**
 * Given a mounted page clone, paginate it into multiple mounted clones (first + continuations).
 * Returns an array of DOM nodes (already mounted under exportStage).
 */
function paginateMountedPageClone(mountedPage, baseTitle) {
  // Record the "one page" height while it's still fixed-size A4
  mountedPage.style.overflow = "hidden";
  mountedPage.style.height = ""; // keep CSS-defined A4 height
  const baseH = mountedPage.getBoundingClientRect().height;

  // Let it expand so we can detect overflow content height
  mountedPage.style.overflow = "visible";
  mountedPage.style.height = "auto";

  // If it doesn't overflow, restore and return
  if (mountedPage.scrollHeight <= baseH + 1) {
    mountedPage.style.overflow = "hidden";
    mountedPage.style.height = "";
    return [mountedPage];
  }

  const breakables = getBreakableItems(mountedPage);
  if (!breakables.length) {
    // Can't split safely; restore and return single (will clip like before)
    mountedPage.style.overflow = "hidden";
    mountedPage.style.height = "";
    return [mountedPage];
  }

  // Move items from bottom into a buffer until the first page fits
  const moved = [];
  // We'll always pick the last breakable that still exists in DOM
  while (mountedPage.scrollHeight > baseH + 1) {
    const itemsNow = getBreakableItems(mountedPage);
    const last = itemsNow[itemsNow.length - 1];
    if (!last) break;
    moved.unshift(last); // preserve order
    last.remove();
  }

  // Restore first page to fixed A4
  mountedPage.style.overflow = "hidden";
  mountedPage.style.height = "";

  if (!moved.length) return [mountedPage];

  // Build continuation pages by filling until each page reaches baseH
  const pages = [mountedPage];

  let remaining = moved.slice();
  while (remaining.length) {
    const { cont, flow } = makeContinuationPage(mountedPage, baseTitle);

    // Mount cont temporarily to measure heights while filling
    mountedPage.parentElement.appendChild(cont);

    cont.style.overflow = "visible";
    cont.style.height = "auto";

    // Fill items until we overflow, then back off last and continue next page
    while (remaining.length) {
      const item = remaining[0];
      flow.appendChild(item);
      remaining.shift();

      if (cont.scrollHeight > baseH + 1) {
        // remove last added and keep it for next page
        flow.removeChild(item);
        remaining.unshift(item);
        break;
      }
    }

    // Fix cont to A4
    cont.style.overflow = "hidden";
    cont.style.height = "";

    pages.push(cont);
  }

  return pages;
}

/**
 * Capture a mounted node to a PNG blob, fitting to A4 pixel size.
 * (Uses existing nodeToPngBlob that preserves the full node, then scales to target.)
 */
async function captureMountedPageToPngBlob(node, targetW, targetH) {
  // Remove any transforms (can cause "only top-left" captures on some browsers)
  const prevTransform = node.style.transform;
  node.style.transform = "none";
  try {
    const blob = await nodeToPngBlob(node, targetW, targetH);
    return blob;
  } finally {
    node.style.transform = prevTransform;
  }
}

async function exportAll(opts = {}) {
  const {
    downloadPrefix = "wrapped_2025",
    exportMode = "png", // "png" or "pdf"
    dpi = 300,
  } = opts;

  // A4 @ 300dpi
  const TARGET_W = Math.round((210 / 25.4) * dpi); // 2480
  const TARGET_H = Math.round((297 / 25.4) * dpi); // 3508

  const pages = Array.from(document.querySelectorAll("section.page"));

  // Build initial clones array (one per section). Pagination happens after mounting.
  const clones = pages.flatMap((p) => buildPaginatedExportSections(p));

  // Stage for offscreen rendering
  const exportStage = document.getElementById("exportStage");
  exportStage.innerHTML = "";
  exportStage.style.position = "fixed";
  exportStage.style.left = "-200vw";
  exportStage.style.top = "0";
  exportStage.style.width = "1px";
  exportStage.style.height = "1px";
  exportStage.style.overflow = "visible";
  exportStage.style.zIndex = "-1";

  const renderedBlobs = [];

  // Mount, paginate, capture
  for (let i = 0; i < clones.length; i++) {
    const clone = clones[i];
    exportStage.appendChild(clone);

    // Wait a frame for layout (fonts/charts)
    await new Promise((r) => requestAnimationFrame(() => r()));
    await new Promise((r) => setTimeout(r, 25));

    const meta = clone.__paginationMeta || { baseTitle: "Devam" };

    // Paginate this mounted clone into potentially multiple mounted pages
    const paginated = paginateMountedPageClone(clone, meta.baseTitle);

    // If paginate created extra pages, it already mounted them after clone.
    // We should capture each in order.
    for (let j = 0; j < paginated.length; j++) {
      const pageNode = paginated[j];

      // Ensure it is at top-left of stage (no scroll offsets)
      pageNode.scrollTop = 0;
      pageNode.scrollLeft = 0;

      const blob = await captureMountedPageToPngBlob(
        pageNode,
        TARGET_W,
        TARGET_H
      );
      renderedBlobs.push(blob);
    }

    // Important: if paginate created extra nodes, keep them; they will be cleared at end anyway.
  }

  // Download
  if (exportMode === "png") {
    for (let i = 0; i < renderedBlobs.length; i++) {
      const blob = renderedBlobs[i];
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${downloadPrefix}_${String(i + 1).padStart(2, "0")}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      await new Promise((r) => setTimeout(r, 150));
    }
    toast(`PNG export tamamlandı: ${renderedBlobs.length} sayfa`);
    return;
  }

  if (exportMode === "pdf") {
    // If jsPDF exists in the file already, use it; otherwise fall back to browser print
    if (typeof window.jspdf?.jsPDF !== "function") {
      toast("jsPDF bulunamadı. Tarayıcı yazdırma penceresi açılıyor…");
      window.print();
      return;
    }

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: "portrait",
      unit: "pt",
      format: "a4",
      compress: true,
    });

    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();

    for (let i = 0; i < renderedBlobs.length; i++) {
      const blob = renderedBlobs[i];
      const dataUrl = await blobToDataURL(blob);
      if (i > 0) pdf.addPage();
      pdf.addImage(dataUrl, "PNG", 0, 0, pageW, pageH, undefined, "FAST");
    }

    pdf.save(`${downloadPrefix}.pdf`);
    toast(`PDF export tamamlandı: ${renderedBlobs.length} sayfa`);
  }
}

async function blobToDataURL(blob) {
  return await new Promise((resolve) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.readAsDataURL(blob);
  });
}

  const btn = document.getElementById("exportPngZipBtn");
  if (!btn) return;
  btn.addEventListener("click", () => exportAll({ mode: "pngzip300", scale: 2 }));
