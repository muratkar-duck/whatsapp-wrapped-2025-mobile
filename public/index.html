<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Wrapped Experience</title>

  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }

    html, body{
      width:100%;
      height:100%;
      background:#0b0b14;
      color:#fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      overflow:hidden;
      scroll-behavior:smooth;
    }

    main{
      height:100vh;
      overflow-y:scroll;
      scroll-snap-type:y mandatory;
    }

    .story{
      height:100vh;
      scroll-snap-align:start;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .story::before{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(1200px 800px at 50% -200px, #3b1cff33, transparent);
      z-index:0;
    }

    .content{
      max-width:560px;
      width:100%;
      text-align:center;
      opacity:0;
      transform:translateY(18px);
      position:relative;
      z-index:1;
    }

    .story.active .content{
      animation:fadeIn .7s ease-out forwards;
    }

    h1{
      font-size:clamp(28px, 6vw, 42px);
      margin-bottom:12px;
    }

    p{
      font-size:clamp(16px, 4.2vw, 20px);
      opacity:.9;
      line-height:1.5;
    }

    .scroll-hint{
      position:absolute;
      bottom:24px;
      left:50%;
      transform:translateX(-50%);
      font-size:13px;
      opacity:.6;
      animation:bounce 1.8s infinite;
    }

    @keyframes fadeIn{
      from{ opacity:0; transform:translateY(18px); }
      to{ opacity:1; transform:translateY(0); }
    }

    @keyframes bounce{
      0%,100%{ transform:translate(-50%,0); }
      50%{ transform:translate(-50%,8px); }
    }

    /* Hearts */
    #hearts{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:9;
      overflow:hidden;
    }

    .heart{
      position:absolute;
      bottom:-40px;
      font-size:22px;
      animation:floatUp linear forwards;
    }

    @keyframes floatUp{
      to{
        transform:translateY(-110vh);
        opacity:0;
      }
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation:none!important; }
      html{ scroll-behavior:auto; }
    }
  </style>
</head>

<body>
  <main id="wrapper">

    <section class="story active">
      <div class="content">
        <h1>2025 Wrapped</h1>
        <p>Bu yıl seninle her şey veriye dönüştü.</p>
      </div>
      <div class="scroll-hint">Kaydır ↓</div>
    </section>

    <section class="story">
      <div class="content">
        <h1>En Yoğun Ay</h1>
        <p>Kasım ayında rekor kırdınız.</p>
      </div>
    </section>

    <section class="story">
      <div class="content">
        <h1>Toplam Mesaj</h1>
        <p>Binlerce mesaj, tek bir hikâye.</p>
      </div>
    </section>

    <section class="story story-12">
      <div class="content">
        <h1>Ve Birlikte…</h1>
        <p>2026’ya da buradan devam.</p>
      </div>
    </section>

  </main>

  <div id="hearts"></div>

  <script>
    const stories = Array.from(document.querySelectorAll('.story'));
    let index = 0;
    let locked = false;

    function setActive(i){
      stories.forEach((s, idx) => s.classList.toggle('active', idx === i));
    }

    function clamp(v, min, max){
      return Math.max(min, Math.min(max, v));
    }

    function goTo(i){
      index = clamp(i, 0, stories.length - 1);
      locked = true;
      setActive(index);
      stories[index].scrollIntoView({ behavior:'smooth', block:'start' });
      setTimeout(()=> locked = false, 750);
    }

    // Wheel
    window.addEventListener('wheel', e=>{
      if(locked) return;
      if(Math.abs(e.deltaY) < 10) return;
      e.preventDefault();
      goTo(index + (e.deltaY > 0 ? 1 : -1));
    }, { passive:false });

    // Touch
    let startY = 0;
    window.addEventListener('touchstart', e=>{
      startY = e.touches[0].clientY;
    }, { passive:true });

    window.addEventListener('touchend', e=>{
      if(locked) return;
      const endY = e.changedTouches[0].clientY;
      const diff = startY - endY;
      if(Math.abs(diff) < 55) return;
      goTo(index + (diff > 0 ? 1 : -1));
    }, { passive:true });

    // Scroll sync
    let raf;
    window.addEventListener('scroll', ()=>{
      if(raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(()=>{
        const mid = window.scrollY + innerHeight * .5;
        let best = 0, dist = Infinity;
        stories.forEach((s,i)=>{
          const d = Math.abs(s.offsetTop - mid);
          if(d < dist){ dist = d; best = i; }
        });
        index = best;
        setActive(index);
      });
    }, { passive:true });

    // Hearts on last story
    const hearts = document.getElementById('hearts');
    function createHeart(){
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '❤️';
      h.style.left = Math.random()*100 + '%';
      h.style.animationDuration = (Math.random()*2+2)+'s';
      hearts.appendChild(h);
      setTimeout(()=>h.remove(), 5000);
    }

    const observer = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting && e.target.classList.contains('story-12')){
          const t = setInterval(createHeart, 260);
          setTimeout(()=>clearInterval(t), 9000);
        }
      });
    }, { threshold:.6 });

    stories.forEach(s=>observer.observe(s));
  </script>
</body>
</html>
